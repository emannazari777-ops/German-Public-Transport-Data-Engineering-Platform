
name: Data Engineering CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Python Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Check Python syntax
        run: |
          python -m compileall -q src tests airflow/dags

      - name: Run data-independent tests
        run: |
          python -m pytest \
            tests/test_cloud_integrity.py \
            tests/test_cloud_storage.py \
            tests/test_dead_letter_queue.py \
            tests/test_gtfs_consumer.py \
            tests/test_gtfs_event.py \
            tests/test_message_queue.py \
            tests/test_routes_unit.py \
            tests/test_stops_unit.py \
            tests/test_stop_times_unit.py \
            tests/test_trips_unit.py \
            -v
